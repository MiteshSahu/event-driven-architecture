server:
  port: 8084
spring:
  application:
    name: csv-collector
  datasource:
    url: jdbc:postgresql://localhost:5432/orders
    username: platform
    password: platform
    hikari.maximum-pool-size: 6
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: csv-collectors
      enable-auto-commit: false
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      ack-mode: manual_immediate
      concurrency: ${COLLECTOR_CONCURRENCY:4}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
management:
  endpoints.web.exposure.include: health,info,metrics
  endpoint.health.probes.enabled: true
app:
  collector:
    mode: ${COLLECTOR_MODE:safe}
    timeout-seconds: ${COLLECTOR_TIMEOUT_SECONDS:10}
    processing-delay-ms: ${COLLECTOR_PROCESSING_DELAY_MS:0}
    max-attempts: ${COLLECTOR_MAX_ATTEMPTS:3}
    retry-delay-ms: ${COLLECTOR_RETRY_DELAY_MS:500}
    executor-mode: ${COLLECTOR_EXECUTOR_MODE:bounded}
    worker-threads: ${COLLECTOR_WORKER_THREADS:4}
    queue-capacity: ${COLLECTOR_QUEUE_CAPACITY:100}
