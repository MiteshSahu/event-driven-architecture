server:
  port: 8081

spring:
  application:
    name: csv-ingestion
  datasource:
    url: jdbc:postgresql://localhost:5432/orders
    username: platform
    password: platform
    hikari:
      maximum-pool-size: 5
  servlet:
    multipart:
      max-file-size: 1GB
      max-request-size: 1GB

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    dev.learning.platform: INFO

